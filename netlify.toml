[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Server bundles and Netlify adapter output embed runtime env at build time (expected).
  # Root `.next/` is created by `npm run build`; `.netlify/` by @netlify/plugin-nextjs. Both must be excluded from scanning except public static assets.
  SECRETS_SCAN_OMIT_PATHS = ".next/server/**,.next/cache/**,.next/standalone/**,.next/required-server-files.json,.next/required-server-files.js,.next/static/**,.netlify/.next/cache/**,.netlify/.next/server/**,.netlify/.next/standalone/**,.netlify/.next/required-server-files.json,.netlify/.next/required-server-files.js,.netlify/.next/static/**,.netlify/functions-internal/**,.netlify/plugins/**"
  # NEXT_PUBLIC_* is inlined into client JS by Next.js (public Google Web client ID, not a secret).
  SECRETS_SCAN_OMIT_KEYS = "PORT,NEXT_PUBLIC_GOOGLE_CLIENT_ID"

# Next.js App Router and /api Route Handlers are served by Netlify's Next.js integration.
# Do not add a separate netlify/functions tree for API routes.
